    --void:#0B0E24;
    --surface:#141935;
    --line:#2A3160;
    --amber:#F2B441;
    --violet:#8A7BF0;
    --text:#E6E7F2;
    --muted:#9AA0C6;

    --display:"Newsreader",Georgia,"Times New Roman",serif;
    --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  }

  html{scroll-behavior:smooth}
  body{

    background:var(--void);

    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:12px var(--pad);
    background:rgba(11,14,36,.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-id{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--muted);text-decoration:none}
  .bar-id b{color:var(--text);font-weight:500}

  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{
    appearance:none;border:0;cursor:pointer;
    background:transparent;color:var(--muted);
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    padding:6px 13px;transition:background .18s,color .18s;
  }
  .lang button:hover{color:var(--text)}
  .lang button[aria-pressed="true"]{background:var(--amber);color:var(--void)}

  /* ---------- hero ---------- */
  .hero{position:relative;padding:clamp(48px,9vw,110px) var(--pad) clamp(40px,7vw,80px);overflow:hidden}
  #wave{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .hero-inner{position:relative;z-index:1;max-width:1080px;margin:0 auto}

  .eyebrow{
    font-family:var(--display);font-style:italic;font-weight:300;
    font-size:clamp(15px,2vw,19px);color:var(--amber);

  }
  .id-row{display:flex;align-items:center;gap:clamp(16px,3vw,28px);flex-wrap:wrap}
  .avatar{
    width:clamp(76px,11vw,112px);height:clamp(76px,11vw,112px);
    border-radius:50%;border:1px solid var(--line);
    box-shadow:0 0 0 6px rgba(138,123,240,.10);
  }
  h1{
    font-family:var(--display);font-weight:300;
    font-size:clamp(40px,8.5vw,86px);line-height:.98;
    letter-spacing:-.02em;margin:0;
  }
  .handle{
    font-family:var(--mono);font-size:13px;letter-spacing:.06em;
    color:var(--muted);margin:10px 0 0;
  }
  .tagline{
    max-width:36ch;margin:26px 0 0;
    font-size:clamp(17px,2.3vw,21px);line-height:1.5;color:var(--text);
  }
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding:0;list-style:none}
  .links a{
    display:inline-block;text-decoration:none;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
    padding:8px 15px;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);background:rgba(20,25,53,.55);
    transition:border-color .18s,color .18s,transform .18s;
  }
  .links a:hover{color:var(--text);border-color:var(--violet);transform:translateY(-2px)}

  /* ---------- generic section ---------- */
  .section{padding:clamp(48px,7vw,86px) var(--pad);border-top:1px solid var(--line)}
  .section-inner{max-width:1080px;margin:0 auto}
  .label{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--violet);margin:0 0 26px;
  }
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,5vw,64px)}
  .prose p{margin:0 0 18px;font-size:clamp(16px,1.7vw,17.5px);color:#D3D6E8;max-width:62ch}
  .prose p:last-child{margin-bottom:0}
  .prose em{color:var(--amber);font-style:normal}

  .facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .facts li{
    display:flex;justify-content:space-between;gap:18px;
    padding:13px 0;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:13px;
  }
  .facts dt,.facts .k{color:var(--muted);letter-spacing:.04em}
  .facts .v{color:var(--text);text-align:right}
  .facts a{color:var(--amber);text-decoration:none}

  /* ---------- publications ---------- */

  .stats li{display:flex;flex-direction:column;gap:6px}
  .stats .n{font-family:var(--display);font-weight:300;font-size:clamp(34px,5vw,50px);line-height:1;color:var(--amber)}
  .stats .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  .papers{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .papers li{
    display:grid;grid-template-columns:136px minmax(0,1fr) auto;
    gap:clamp(14px,2.6vw,30px);align-items:center;
    padding:22px 0;border-bottom:1px solid var(--line);
  }
  .papers .fig{
    display:flex;align-items:center;justify-content:center;
    width:136px;aspect-ratio:4/3;overflow:hidden;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;
    transition:border-color .18s;
  }
  a.fig:hover{border-color:var(--amber)}
  .papers .fig img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
  .papers .fig .ph{font-family:var(--display);font-style:italic;font-weight:300;font-size:38px;color:var(--violet);opacity:.7}
  .papers .side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .papers .actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .papers .actions button,.papers .actions a{
    appearance:none;cursor:pointer;text-decoration:none;white-space:nowrap;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;line-height:1.4;
    color:var(--muted);background:rgba(20,25,53,.55);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;
    transition:border-color .18s,color .18s;
  }
  .papers .actions button:hover,.papers .actions a:hover{color:var(--text);border-color:var(--amber)}
  .papers .actions .done{color:var(--amber);border-color:rgba(242,180,65,.42)}
  .papers h3{
    font-family:var(--display);font-weight:500;
    font-size:clamp(18px,2.3vw,23px);line-height:1.3;margin:0 0 8px;max-width:56ch;

  .papers h3 a{text-decoration:none;transition:color .18s}
  .papers h3 a:hover{color:var(--amber)}
  .papers .src{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.03em}
  .papers .cites{
    font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--violet);
    white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  }
  .lede{margin:-6px 0 26px;color:#C7CBE2;max-width:58ch;font-size:clamp(16px,1.7vw,17.5px)}

  .topics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:0;list-style:none}
  .topics li{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);

  #topics-label{margin-bottom:14px}

  .repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .repo{
    display:block;text-decoration:none;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:22px;transition:border-color .18s,transform .18s;

  .repo:hover{border-color:var(--amber);transform:translateY(-3px)}
  .repo h3{font-family:var(--mono);font-size:15px;font-weight:500;margin:0 0 10px;color:var(--text);word-break:break-word}
  .repo p{margin:0 0 18px;font-size:14.5px;color:var(--muted);min-height:1.6em}
  .repo .meta{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .repo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--violet);margin-right:7px;vertical-align:-1px}
  .status{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:16px 0 0}

  /* ---------- footer ---------- */
  footer{padding:34px var(--pad) 54px;border-top:1px solid var(--line);color:var(--muted)}
  .footer-inner{
    max-width:1080px;margin:0 auto;
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  }
  footer a{color:var(--muted)}

    .cols{grid-template-columns:1fr}
    .tagline{max-width:none}
    .papers li{grid-template-columns:96px minmax(0,1fr)}

    .papers .side{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .papers .actions{justify-content:flex-start}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none!important}
  }
</style>

  "10.5281/zenodo.23779294": {
    src:"https://raw.githubusercontent.com/levsan13/LLMatter2D/main/paper/figures/archimedean_bands.png",
    alt:"Nearest-neighbour tight-binding bands of the 11 Archimedean lattices"
  }
};
const ORCID = "0009-0004-2541-7934";

/* =======================================================================
   2. LANGUAGE SWITCH
   ======================================================================= */
let lang = "en";

function applyLang(next){
  lang = I18N[next] ? next : "en";
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = lang === "pt"
    ? "Sergio Levy — levsan13 · Física e aprendizado de máquina"
    : "Sergio Levy — levsan13 · Physics and machine learning";

  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const text = I18N[lang][el.getAttribute("data-i18n")];
    if (text !== undefined) el.textContent = text;
  });
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });

  const url = new URL(window.location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);

  if (state.repos) renderRepos();
  if (state.papers) renderPapers();
}

document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){ applyLang(b.dataset.lang); });
});

/* language is initialised at the end of this file, once the data layer exists */

/* =======================================================================
   3. DATA — repositories and publications
   ======================================================================= */
const state = { repos:null, papers:null };

/* how many repositories the highlights section shows */
const MAX_HIGHLIGHTS = 6;

/* GitHub topics that count as the electronics thread — these get highlighted */
const HW_TOPICS = ["arduino","esp32","esp8266","embedded","embedded-systems","firmware","pcb",
  "kicad","electronics","iot","microcontroller","stm32","avr","fpga","verilog","vhdl","hardware",
  "raspberry-pi","robotics","plc","automation","signal-processing","dsp","sensors","instrumentation",
  "power-electronics","circuit","circuits","spice","analog","rtos","can-bus","modbus"];

function statusLine(el, key, href, linkKey){
  el.textContent = key ? I18N[lang][key] + (href ? " " : "") : "";
  if (href){
    const a = document.createElement("a");
    a.href = href;
    a.textContent = I18N[lang][linkKey];
    a.style.color = "var(--amber)";
    el.appendChild(a);
  }
}

/* --- my repositories, most starred first --- */
const repoGrid = document.getElementById("repo-grid");
const repoStatus = document.getElementById("repo-status");
const topicStrip = document.getElementById("topic-strip");
const topicsLabel = document.getElementById("topics-label");

function renderTopics(list){
  const counts = {};
  list.forEach(function(r){
    (r.topics || []).forEach(function(t){ counts[t] = (counts[t] || 0) + 1; });
  });
  const names = Object.keys(counts).sort(function(a,b){
    const hw = (HW_TOPICS.indexOf(b) > -1) - (HW_TOPICS.indexOf(a) > -1);
    return hw || (counts[b] - counts[a]) || a.localeCompare(b);
  }).slice(0, 16);

  topicStrip.innerHTML = "";
  names.forEach(function(t){
    const li = document.createElement("li");
    if (HW_TOPICS.indexOf(t) > -1) li.className = "hw";
    li.textContent = t;
    topicStrip.appendChild(li);
  });
  topicsLabel.hidden = names.length === 0;
}

function renderRepos(){
  const list = state.repos.list;
  repoGrid.innerHTML = "";

  list.forEach(function(r){
    const a = document.createElement("a");
    a.className = "repo";
    a.href = r.html_url;

    const h = document.createElement("h3");
    h.textContent = r.name;

    const p = document.createElement("p");
    p.textContent = r.description || I18N[lang]["repos.noDescription"];

    const meta = document.createElement("div");
    meta.className = "meta";
    if (r.language){
      const s = document.createElement("span");
      s.innerHTML = '<span class="dot"></span>';
      s.appendChild(document.createTextNode(r.language));
      meta.appendChild(s);
    }
    const stars = document.createElement("span");
    stars.textContent = "\u2605 " + (r.stargazers_count || 0);
    meta.appendChild(stars);
    if (r.pushed_at){
      const d = document.createElement("span");
      d.textContent = I18N[lang]["repos.updated"] + " " +
        new Date(r.pushed_at).toLocaleDateString(lang === "pt" ? "pt-BR" : "en-GB",
          { year:"numeric", month:"short" });
      meta.appendChild(d);
    }

    a.append(h, p, meta);
    repoGrid.appendChild(a);
  });

  renderTopics(list);

  const empty = list.length === 0;
  statusLine(repoStatus,
    state.repos.live ? (empty ? "highlights.empty" : null) : "highlights.offline",
    (state.repos.live && !empty) ? null : "https://github.com/levsan13?tab=repositories",
    "highlights.reposLink");
}

statusLine(repoStatus, "highlights.loading");
fetch("https://api.github.com/users/levsan13/repos?per_page=100")
  .then(function(r){ if(!r.ok) throw new Error("api"); return r.json(); })
  .then(function(data){
    const list = (Array.isArray(data) ? data : [])
      .filter(function(r){ return !r.fork; })
      .sort(function(a,b){ return (b.stargazers_count - a.stargazers_count) ||
                                  (new Date(b.pushed_at) - new Date(a.pushed_at)); })
      .slice(0, MAX_HIGHLIGHTS);
    state.repos = { list: list, live: true };
    renderRepos();
  })
  .catch(function(){
    state.repos = { list: FALLBACK_REPOS, live: false };
    renderRepos();
  });

/* --- publications from the ORCID record, citation counts from OpenAlex --- */
const paperList = document.getElementById("paper-list");
const paperStats = document.getElementById("paper-stats");
const paperStatus = document.getElementById("paper-status");

function hIndex(counts){
  const sorted = counts.slice().sort(function(a,b){ return b - a; });
  let h = 0;
  while (h < sorted.length && sorted[h] >= h + 1) h++;
  return h;
}

function renderPapers(){
  const list = state.papers.list;
  paperList.innerHTML = "";

  const counted = list.filter(function(p){ return typeof p.cites === "number"; })
                      .map(function(p){ return p.cites; });
  const total = counted.reduce(function(a,b){ return a + b; }, 0);

  paperStats.hidden = list.length === 0;
  document.getElementById("stat-works").textContent = list.length;
  document.getElementById("stat-cites").textContent = total;
  document.getElementById("stat-h").textContent = hIndex(counted);

  list.forEach(function(p){
    const li = document.createElement("li");
    li.appendChild(paperFigure(p));

    const box = document.createElement("div");
    const h = document.createElement("h3");
    if (p.url){
      const a = document.createElement("a");
      a.href = p.url; a.textContent = p.title;
      h.appendChild(a);
    } else {
      h.textContent = p.title;
    }
    const src = document.createElement("div");
    src.className = "src";
    src.textContent = [p.venue, p.year].filter(Boolean).join(" · ");
    box.append(h, src);
    li.appendChild(box);

    const side = document.createElement("div");
    side.className = "side";
    if (typeof p.cites === "number"){
      const c = document.createElement("span");
      c.className = "cites";
      c.textContent = p.cites + " " + I18N[lang][p.cites === 1 ? "papers.citation" : "papers.citations"];
      side.appendChild(c);
    }
    side.appendChild(paperActions(p));
    li.appendChild(side);
    paperList.appendChild(li);
  });

  if (!list.length){
    statusLine(paperStatus, "papers.empty", "https://orcid.org/" + ORCID, "papers.orcidLink");
  } else {
    statusLine(paperStatus, state.papers.live ? null : "papers.offline");
  }
}

/* The ORCID record is the source of truth: OpenAlex can take weeks to link a
   work to an ORCID (and often never does for Zenodo software/datasets), so
   works are read straight from the ORCID public API. OpenAlex is only asked
   for citation counts, by DOI; if it fails the list still shows. */
function orcidWork(group){
  const w = group["work-summary"][0];
  const ids = (w["external-ids"] && w["external-ids"]["external-id"]) || [];
  const doiId = ids.filter(function(i){ return i["external-id-type"] === "doi"; })[0];
  const doi = doiId
    ? ((doiId["external-id-normalized"] && doiId["external-id-normalized"].value) || doiId["external-id-value"]).toLowerCase()
    : null;
  const type = (w.type || "").replace(/-/g, " ");
  return {
    title: w.title && w.title.title ? w.title.title.value : "",
    venue: (w["journal-title"] && w["journal-title"].value) || (type && type.charAt(0).toUpperCase() + type.slice(1)),
    year: w["publication-date"] && w["publication-date"].year ? Number(w["publication-date"].year.value) : null,
    url: doi ? "https://doi.org/" + doi : (w.url && w.url.value) || null,
    doi: doi,
    cites: null,
    figure: (doi && PAPER_FIGURES[doi]) || null
  };
}

function addCitations(list){
  const dois = list.filter(function(p){ return p.doi; }).map(function(p){ return p.doi; });
  if (!dois.length) return Promise.resolve(list);
  return fetch("https://api.openalex.org/works?filter=doi:" + dois.join("|") +
               "&per_page=50&select=doi,cited_by_count")
    .then(function(r){ if(!r.ok) throw new Error("api"); return r.json(); })
    .then(function(data){
      const byDoi = {};
      (data.results || []).forEach(function(w){
        if (w.doi) byDoi[w.doi.replace("https://doi.org/", "").toLowerCase()] = w.cited_by_count;
      });
      list.forEach(function(p){ if (p.doi && typeof byDoi[p.doi] === "number") p.cites = byDoi[p.doi]; });
      return list;
    })
    .catch(function(){ return list; });
}

/* --- per-paper figure and buttons --- */
function placeholderFigure(){
  const ph = document.createElement("div");
  ph.className = "fig";
  ph.setAttribute("aria-hidden", "true");
  ph.innerHTML = '<span class="ph">ψ</span>';
  return ph;
}

function paperFigure(p){
  if (!p.figure) return placeholderFigure();
  const a = document.createElement("a");
  a.className = "fig";
  a.href = p.figure.src; a.target = "_blank"; a.rel = "noopener";
  a.title = I18N[lang]["papers.figure"];
  const img = document.createElement("img");
  img.src = p.figure.src;
  img.alt = p.figure.alt || p.title;
  img.loading = "lazy";
  img.addEventListener("error", function(){ a.replaceWith(placeholderFigure()); });
  a.appendChild(img);
  return a;
}

function flash(btn, key){
  btn.textContent = I18N[lang][key];
  btn.classList.add("done");
  setTimeout(function(){
    btn.textContent = I18N[lang][btn.dataset.key];
    btn.classList.remove("done");
  }, 2000);
}

function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  window.prompt(I18N[lang]["papers.copyPrompt"], text);
  return Promise.resolve();
}

/* APA reference from doi.org content negotiation, or a plain one from ORCID data */
function citation(p){
  if (p.citation) return Promise.resolve(p.citation);
  const plain = [p.title, p.venue, p.year, p.url].filter(Boolean).join(". ");
  if (!p.doi) return Promise.resolve(plain);
  return fetch("https://doi.org/" + p.doi, { headers: { "Accept": "text/x-bibliography; style=apa" } })
    .then(function(r){ if(!r.ok) throw new Error("doi"); return r.text(); })
    .then(function(html){
      const text = new DOMParser().parseFromString(html, "text/html").body.textContent.trim();
      return (p.citation = text || plain);
    })
    .catch(function(){ return plain; });
}

function actionButton(key, onClick){
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.key = key;
  b.textContent = I18N[lang][key];
  b.addEventListener("click", function(){ onClick(b); });
  return b;
}

function paperActions(p){
  const box = document.createElement("div");
  box.className = "actions";
  const link = p.url || ("https://orcid.org/" + ORCID);

  box.appendChild(actionButton("papers.cite", function(b){
    citation(p).then(copyText).then(function(){ flash(b, "papers.copied"); });
  }));
  box.appendChild(actionButton("papers.share", function(b){
    if (navigator.share){
      navigator.share({ title: p.title, url: link }).catch(function(){});
    } else {
      copyText(link).then(function(){ flash(b, "papers.linkCopied"); });
    }
  }));
  if (p.url){
    const a = document.createElement("a");
    a.href = p.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = I18N[lang]["papers.open"];
    box.appendChild(a);
  }
  return box;
}

/* Zenodo records often carry a figure among their files */
function addZenodoFigures(list){
  list.forEach(function(p){
    const m = !p.figure && p.doi && p.doi.match(/^10\.5281\/zenodo\.(\d+)$/);
    if (!m) return;
    fetch("https://zenodo.org/api/records/" + m[1])
      .then(function(r){ if(!r.ok) throw new Error("zenodo"); return r.json(); })
      .then(function(rec){
        const img = (rec.files || []).filter(function(f){ return /\.(png|jpe?g|gif|webp|svg)$/i.test(f.key); })[0];
        if (!img) return;
        p.figure = { src: img.links.self, alt: p.title };
        renderPapers();
      })
      .catch(function(){});
  });
}

statusLine(paperStatus, "papers.loading");
fetch("https://pub.orcid.org/v3.0/" + ORCID + "/works", { headers: { "Accept": "application/json" } })
  .then(function(r){ if(!r.ok) throw new Error("api"); return r.json(); })
  .then(function(data){
    const found = (data.group || [])
      .filter(function(g){ return g["work-summary"] && g["work-summary"].length; })
      .map(orcidWork)
      .sort(function(a,b){ return (b.year || 0) - (a.year || 0); });
    return addCitations(found);
  })
  .then(function(found){
    state.papers = { list: MANUAL_PAPERS.concat(found), live: true };
    renderPapers();
    addZenodoFigures(state.papers.list);
  })
  .catch(function(){
    state.papers = { list: MANUAL_PAPERS, live: false };
    renderPapers();
  });

/* =======================================================================
   4. SIGNATURE: a Gaussian wave packet propagating over curved space.
      Amber = Re(ψ), violet = Im(ψ), soft fill = |ψ|.
   ======================================================================= */
(function(){
  const canvas = document.getElementById("wave");
  const ctx = canvas.getContext("2d");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, start = null;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduced) draw(6.5);
  }

  /* the curved axis the packet rides on */
  function axisY(x){
    const t = x / W;
    return H * 0.60 - Math.sin(t * Math.PI) * H * 0.10 - t * H * 0.06;
  }

  function grid(){
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(42,49,96,0.55)";
    for (let i = -3; i <= 4; i++){
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8){
        const y = axisY(x) + i * H * 0.085;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    const step = Math.max(70, W / 14);
    for (let x = 0; x <= W; x += step){
      ctx.beginPath();
      ctx.moveTo(x, axisY(x) - H * 0.30);
      ctx.lineTo(x + H * 0.02, axisY(x) + H * 0.36);
      ctx.stroke();
    }
  }

  function packet(t){
    const speed = W / 13;                     // px per second
    const x0 = -W * 0.30 + speed * t;          // center of the packet
    const sigma = W * 0.055 * Math.sqrt(1 + Math.pow(t / 5.5, 2));  // dispersion
    const amp = H * 0.20 / Math.sqrt(1 + Math.pow(t / 5.5, 2));
    const k = 0.16;

    function psi(x){
      const u = (x - x0) / sigma;
      const env = Math.exp(-0.5 * u * u);
      const phase = k * (x - x0) - 2.1 * t;
      return { env: env, re: env * Math.cos(phase), im: env * Math.sin(phase) };
    }

    // |ψ| envelope
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) ctx.lineTo(x, axisY(x) - psi(x).env * amp);
    for (let x = W; x >= 0; x -= 3) ctx.lineTo(x, axisY(x) + psi(x).env * amp);
    ctx.closePath();
    const g = ctx.createLinearGradient(x0 - sigma * 2, 0, x0 + sigma * 2, 0);
    g.addColorStop(0, "rgba(138,123,240,0.12)");
    g.addColorStop(1, "rgba(242,180,65,0.10)");
    ctx.fillStyle = g;
    ctx.fill();

    // Im(ψ)
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) ctx.lineTo(x, axisY(x) - psi(x).im * amp);
    ctx.strokeStyle = "rgba(138,123,240,0.75)";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // Re(ψ)
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) ctx.lineTo(x, axisY(x) - psi(x).re * amp);
    ctx.strokeStyle = "rgba(242,180,65,0.95)";
    ctx.lineWidth = 2;
    ctx.shadowColor = "rgba(242,180,65,0.45)";
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function draw(t){
    ctx.clearRect(0, 0, W, H);
    grid();
    packet(t);
  }

  function frame(now){
    if (start === null) start = now;
    let t = (now - start) / 1000;
    if (t > 21) { start = now; t = 0; }        // packet has left the frame
    draw(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();

   5. START — pick the language and paint every label

const browserLang = (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en";
applyLang(urlLang === "pt" || urlLang === "en" ? urlLang : browserLang);
