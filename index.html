<style>
  :root{
    /* Palette: a complex wavefunction plot — indigo field, amber Re(ψ), violet Im(ψ) */
    --void:#0B0E24;
    --surface:#141935;
    --line:#2A3160;
    --amber:#F2B441;
    --violet:#8A7BF0;
    --text:#E6E7F2;
    --muted:#9AA0C6;

    --display:"Newsreader",Georgia,"Times New Roman",serif;
    --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

    --pad:clamp(20px,5vw,72px);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--void);
    color:var(--text);
    font-family:var(--body);
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  ::selection{background:var(--amber);color:var(--void)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}

  /* ---------- top bar ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:12px var(--pad);
    background:rgba(11,14,36,.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-id{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--muted);text-decoration:none}
  .bar-id b{color:var(--text);font-weight:500}

  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{
    appearance:none;border:0;cursor:pointer;
    background:transparent;color:var(--muted);
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    padding:6px 13px;transition:background .18s,color .18s;
  }
  .lang button:hover{color:var(--text)}
  .lang button[aria-pressed="true"]{background:var(--amber);color:var(--void)}

  /* ---------- hero ---------- */
  .hero{position:relative;padding:clamp(48px,9vw,110px) var(--pad) clamp(40px,7vw,80px);overflow:hidden}
  #wave{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .hero-inner{position:relative;z-index:1;max-width:1080px;margin:0 auto}

  .eyebrow{
    font-family:var(--display);font-style:italic;font-weight:300;
    font-size:clamp(15px,2vw,19px);color:var(--amber);
    margin:0 0 18px;
  }
  .id-row{display:flex;align-items:center;gap:clamp(16px,3vw,28px);flex-wrap:wrap}
  .avatar{
    width:clamp(76px,11vw,112px);height:clamp(76px,11vw,112px);
    border-radius:50%;border:1px solid var(--line);
    box-shadow:0 0 0 6px rgba(138,123,240,.10);
  }
  h1{
    font-family:var(--display);font-weight:300;
    font-size:clamp(40px,8.5vw,86px);line-height:.98;
    letter-spacing:-.02em;margin:0;
  }
  .handle{
    font-family:var(--mono);font-size:13px;letter-spacing:.06em;
    color:var(--muted);margin:10px 0 0;
  }
  .tagline{
    max-width:36ch;margin:26px 0 0;
    font-size:clamp(17px,2.3vw,21px);line-height:1.5;color:var(--text);
  }
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding:0;list-style:none}
  .links a{
    display:inline-block;text-decoration:none;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
    padding:8px 15px;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);background:rgba(20,25,53,.55);
    transition:border-color .18s,color .18s,transform .18s;
  }
  .links a:hover{color:var(--text);border-color:var(--violet);transform:translateY(-2px)}

  /* ---------- generic section ---------- */
  .section{padding:clamp(48px,7vw,86px) var(--pad);border-top:1px solid var(--line)}
  .section-inner{max-width:1080px;margin:0 auto}
  .label{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--violet);margin:0 0 26px;
  }
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,5vw,64px)}
  .prose p{margin:0 0 18px;font-size:clamp(16px,1.7vw,17.5px);color:#D3D6E8;max-width:62ch}
  .prose p:last-child{margin-bottom:0}
  .prose em{color:var(--amber);font-style:normal}

  .facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .facts li{
    display:flex;justify-content:space-between;gap:18px;
    padding:13px 0;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:13px;
  }
  .facts dt,.facts .k{color:var(--muted);letter-spacing:.04em}
  .facts .v{color:var(--text);text-align:right}
  .facts a{color:var(--amber);text-decoration:none}
  .facts a:hover{text-decoration:underline}

  /* ---------- research ---------- */
  .work{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
  .work article{background:var(--void);padding:clamp(22px,3.4vw,34px)}
  .work h3{
    font-family:var(--display);font-weight:500;
    font-size:clamp(21px,2.7vw,27px);line-height:1.2;margin:0 0 12px;
  }
  .work p{margin:0;color:#C7CBE2;max-width:62ch}
  .work .tag{
    display:inline-block;margin-bottom:14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber);
  }

  /* ---------- repos ---------- */
  .repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .repo{
    display:block;text-decoration:none;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:22px;transition:border-color .18s,transform .18s;
  }
  .repo:hover{border-color:var(--amber);transform:translateY(-3px)}
  .repo h3{font-family:var(--mono);font-size:15px;font-weight:500;margin:0 0 10px;color:var(--text);word-break:break-word}
  .repo p{margin:0 0 18px;font-size:14.5px;color:var(--muted);min-height:1.6em}
  .repo .meta{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .repo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--violet);margin-right:7px;vertical-align:-1px}
  .status{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:16px 0 0}

  /* ---------- footer ---------- */
  footer{padding:34px var(--pad) 54px;border-top:1px solid var(--line);color:var(--muted)}
  .footer-inner{
    max-width:1080px;margin:0 auto;
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  }
  footer a{color:var(--muted)}

  @media (max-width:760px){
    .cols{grid-template-columns:1fr}
    .tagline{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none!important}
  }
</style>

<script>
/* =======================================================================

const I18N = {

/* Fallback used if the GitHub API is unreachable or rate-limited */
const FALLBACK_REPOS = [
  { name:"Wave-Packet-propagation-curvature", html_url:"https://github.com/levsan13/Wave-Packet-propagation-curvature",
    description:"My graduation", language:"C++", stargazers_count:1, pushed_at:null },
  { name:"IBVB-Campanha", html_url:"https://github.com/levsan13/IBVB-Campanha",
    description:null, language:"HTML", stargazers_count:0, pushed_at:null }
];

/* =======================================================================
   2. LANGUAGE SWITCH
   ======================================================================= */
let lang = "en";
let repos = null;

function applyLang(next){
  lang = I18N[next] ? next : "en";
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = lang === "pt"
    ? "Sergio Levy — levsan13 · Física e aprendizado de máquina"
    : "Sergio Levy — levsan13 · Physics and machine learning";

  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const text = I18N[lang][el.getAttribute("data-i18n")];
    if (text !== undefined) el.textContent = text;
  });
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });

  const url = new URL(window.location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);

  if (repos) renderRepos(repos.list, repos.live);
}

document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){ applyLang(b.dataset.lang); });
});

const urlLang = new URLSearchParams(window.location.search).get("lang");
const browserLang = (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en";
applyLang(urlLang === "pt" || urlLang === "en" ? urlLang : browserLang);

/* =======================================================================
   3. REPOSITORIES (live from the GitHub API, with fallback)
   ======================================================================= */
const grid = document.getElementById("repo-grid");
const status = document.getElementById("repo-status");

function renderRepos(list, live){
  grid.innerHTML = "";
  list.forEach(function(r){
    const a = document.createElement("a");
    a.className = "repo";
    a.href = r.html_url;

    const h = document.createElement("h3");
    h.textContent = r.name;

    const p = document.createElement("p");
    p.textContent = r.description || I18N[lang]["repos.noDescription"];

    const meta = document.createElement("div");
    meta.className = "meta";
    if (r.language){
      const s = document.createElement("span");
      s.innerHTML = '<span class="dot"></span>';
      s.appendChild(document.createTextNode(r.language));
      meta.appendChild(s);
    }
    const stars = document.createElement("span");
    stars.textContent = "★ " + (r.stargazers_count || 0);
    meta.appendChild(stars);
    if (r.pushed_at){
      const d = document.createElement("span");
      d.textContent = I18N[lang]["repos.updated"] + " " +
        new Date(r.pushed_at).toLocaleDateString(lang === "pt" ? "pt-BR" : "en-GB",
          { year:"numeric", month:"short" });
      meta.appendChild(d);
    }

    a.append(h, p, meta);
    grid.appendChild(a);
  });
  status.textContent = live ? "" : I18N[lang]["repos.offline"];
}

status.textContent = I18N[lang]["repos.loading"];
fetch("https://api.github.com/users/levsan13/repos?sort=pushed&per_page=100")
  .then(function(r){ if(!r.ok) throw new Error("api"); return r.json(); })
  .then(function(data){
    const list = data.filter(function(r){ return !r.fork; })
                     .sort(function(a,b){ return (b.stargazers_count - a.stargazers_count) ||
                                                 (new Date(b.pushed_at) - new Date(a.pushed_at)); });
    repos = { list: list.length ? list : FALLBACK_REPOS, live: true };
    renderRepos(repos.list, true);
  })
  .catch(function(){
    repos = { list: FALLBACK_REPOS, live: false };
    renderRepos(FALLBACK_REPOS, false);
  });

/* =======================================================================
   4. SIGNATURE: a Gaussian wave packet propagating over curved space.
      Amber = Re(ψ), violet = Im(ψ), soft fill = |ψ|.
   ======================================================================= */
(function(){
  const canvas = document.getElementById("wave");
  const ctx = canvas.getContext("2d");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, start = null;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduced) draw(6.5);
  }

  /* the curved axis the packet rides on */
  function axisY(x){
    const t = x / W;
    return H * 0.60 - Math.sin(t * Math.PI) * H * 0.10 - t * H * 0.06;
  }

  function grid(){
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(42,49,96,0.55)";
    for (let i = -3; i <= 4; i++){
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8){
        const y = axisY(x) + i * H * 0.085;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    const step = Math.max(70, W / 14);
    for (let x = 0; x <= W; x += step){
      ctx.beginPath();
      ctx.moveTo(x, axisY(x) - H * 0.30);
      ctx.lineTo(x + H * 0.02, axisY(x) + H * 0.36);
      ctx.stroke();
    }
  }

  function packet(t){
    const speed = W / 13;                     // px per second
    const x0 = -W * 0.30 + speed * t;          // center of the packet
    const sigma = W * 0.055 * Math.sqrt(1 + Math.pow(t / 5.5, 2));  // dispersion
    const amp = H * 0.20 / Math.sqrt(1 + Math.pow(t / 5.5, 2));
    const k = 0.16;

    function psi(x){
      const u = (x - x0) / sigma;
      const env = Math.exp(-0.5 * u * u);
      const phase = k * (x - x0) - 2.1 * t;
      return { env: env, re: env * Math.cos(phase), im: env * Math.sin(phase) };
    }

    // |ψ| envelope
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) ctx.lineTo(x, axisY(x) - psi(x).env * amp);
    for (let x = W; x >= 0; x -= 3) ctx.lineTo(x, axisY(x) + psi(x).env * amp);
    ctx.closePath();
    const g = ctx.createLinearGradient(x0 - sigma * 2, 0, x0 + sigma * 2, 0);
    g.addColorStop(0, "rgba(138,123,240,0.12)");
    g.addColorStop(1, "rgba(242,180,65,0.10)");
    ctx.fillStyle = g;
    ctx.fill();

    // Im(ψ)
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) ctx.lineTo(x, axisY(x) - psi(x).im * amp);
    ctx.strokeStyle = "rgba(138,123,240,0.75)";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // Re(ψ)
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) ctx.lineTo(x, axisY(x) - psi(x).re * amp);
    ctx.strokeStyle = "rgba(242,180,65,0.95)";
    ctx.lineWidth = 2;
    ctx.shadowColor = "rgba(242,180,65,0.45)";
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function draw(t){
    ctx.clearRect(0, 0, W, H);
    grid();
    packet(t);
  }

  function frame(now){
    if (start === null) start = now;
    let t = (now - start) / 1000;
    if (t > 21) { start = now; t = 0; }        // packet has left the frame
    draw(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
